name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: latest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile

      # PRs: block merge if new complexity introduced
      - name: Complexity audit (new issues only)
        if: github.event_name == 'pull_request'
        run: npx fallow audit --gate new-only

      # Main branch: full audit non-blocking for tracking
      - name: Complexity audit (full)
        if: github.event_name == 'push'
        continue-on-error: true
        run: npx fallow audit --format json

      - run: pnpm test
      - run: pnpm typecheck
